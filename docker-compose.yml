services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env.production
    volumes:
      - sqlite-data:/app/storage/database
      - book-loan-photos:/app/storage/app/book-loans
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sqlite-data:
  book-loan-photos:
  caddy-data:
  caddy-config:
